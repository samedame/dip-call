name: dip-bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "alert | confirm | auto (auto = alert before the close, confirm after) | ping (Discord and data check, writes nothing)"
        required: false
        default: auto
      force:
        description: "ignore the time window and the once-a-day guard"
        type: boolean
        required: false
        default: false
      dry:
        description: "print only: no Discord post, no ledger or state writes"
        type: boolean
        required: false
        default: false
      scheduled_for_et:
        description: "set by the open-scheduler Worker"
        required: false
      trigger:
        description: "set by the open-scheduler Worker"
        required: false
  # Primary trigger: the open-scheduler Worker (alert 15:50 ET, confirm 16:25 ET; first dispatch seen 2026-11-13 20:50 UTC).
  # GitHub starts scheduled runs hours late on this account, so the daily alert crons behind the Worker were removed on
  # 2026-11-13: a late alert run is always "outside the alert window". What is kept:
  schedule:
    # Confirm backup. A late confirm is still a valid confirm (it only needs the final bar); the once-a-day guard makes
    # it a no-op when the Worker's 16:25 ET confirm already ran. 21:27 UTC is 16:27 EST / 17:27 EDT.
    - cron: "27 21 * * 1-5"
    # Early-close days, when the Worker's fixed 15:50 ET slot is after the 13:00 ET close. Pinned to the dates so they
    # do not fire every weekday. UPDATE EACH YEAR (2026: Fri 27 Nov and Thu 24 Dec, both in standard time).
    - cron: "52 17 27 11 *"   # 12:52 ET alert, 27 Nov
    - cron: "27 18 27 11 *"   # 13:27 ET confirm, 27 Nov
    - cron: "52 17 24 12 *"   # 12:52 ET alert, 24 Dec
    - cron: "27 18 24 12 *"   # 13:27 ET confirm, 24 Dec
permissions:
  contents: write
concurrency:
  group: dip-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_ENV: ${{ vars.TRADIER_ENV }}
          PROFILE: ${{ vars.PROFILE }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          SPRINT_FRACTION: ${{ vars.SPRINT_FRACTION }}
        run: python -m bot.run ${{ inputs.mode || 'auto' }} ${{ inputs.force && '--force' || '' }} ${{ inputs.dry && '--dry' || '' }}
      - name: Commit ledger and state
        run: |
          git config user.name "dip-bot"
          git config user.email "dip-bot@users.noreply.github.com"
          git add state ledger
          if ! git diff --cached --quiet; then
            git commit -m "dip-bot: ledger update (run ${{ github.run_id }})"
            git pull --rebase
            git push
          fi
